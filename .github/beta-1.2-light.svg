      <circle cx="90" cy="491" r="12" fill="none" stroke="#16a067" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="488" r="4" fill="none" stroke="#16a067" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M83 499 a8 6 0 0 1 14 0" fill="none" stroke="#16a067" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="500" r="3.5" fill="#16a067" stroke="#f6f7f9" stroke-width="1.5"/>
