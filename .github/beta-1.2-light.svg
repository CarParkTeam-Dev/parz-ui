    <mask id="m"><rect width="1280" height="600" fill="url(#fade)"/></mask>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14141a"/><stop offset="1" stop-color="#0b0b10"/></linearGradient>
  </defs>
