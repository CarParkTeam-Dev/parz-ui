    <text x="62" y="160" font-size="58" font-weight="800" letter-spacing="-2" fill="#16161b">Parz UI <tspan fill="#16a067">1.2</tspan> beta</text>
    <text x="64" y="200" font-size="18" font-weight="500" fill="#3f3f46">Five new components and a big Parz Video upgrade.</text>

