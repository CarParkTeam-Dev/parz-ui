    <text x="64" y="344" font-size="13" fill="#71717a">Plain <tspan font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">npm i</tspan> still installs the stable 1.1.0</text>

    <text x="64" y="394" font-size="12" font-weight="700" letter-spacing="1.4" fill="#71717a">NEW COMPONENTS</text>
    
