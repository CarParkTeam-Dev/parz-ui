<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-label="Parz UI 1.2.0-beta.0 pre-release: npm i @carparkteam/parz-ui@next. New: Tabs, Expander, Days, Color Picker, Avatar. Parz Video: big upgrade.">
  <title>Parz UI 1.2.0-beta.0 — pre-release</title>
  <defs>
    <clipPath id="r"><rect width="1280" height="600" rx="28"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#000000" opacity=".06"/></pattern>
